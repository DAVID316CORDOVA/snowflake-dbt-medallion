name: dbt CI/CD

# CI runs on every push or pull request, validating the code against
# the dev environment. CD runs only after CI succeeds AND only on
# pushes to main -- deploying the validated change to production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # CI: validates the change against dev. Runs on every push and PR.
  # ---------------------------------------------------------------
  ci-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake_dbt_medallion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core==1.12.2 dbt-snowflake==1.12.0

      - name: Install dbt packages
        run: dbt deps

      - name: dbt debug
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt debug

      - name: dbt run (dev)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt run --target dev

      - name: dbt test (dev)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt test --target dev

      - name: dbt snapshot (dev)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt snapshot --target dev

  # ---------------------------------------------------------------
  # CD: deploys to production. Only runs if ci-dev succeeded, and
  # only on a direct push to main (e.g. after a PR merge) -- never
  # on a pull_request event, to avoid deploying unmerged code.
  # ---------------------------------------------------------------
  cd-prod:
    needs: ci-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake_dbt_medallion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core==1.12.2 dbt-snowflake==1.12.0

      - name: Install dbt packages
        run: dbt deps

      - name: dbt run (prod)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt run --target prod

      - name: dbt test (prod)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt test --target prod

      - name: dbt snapshot (prod)
        env:
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_PROFILES_DIR: .
        run: dbt snapshot --target prod
